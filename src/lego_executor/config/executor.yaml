oracle_moveit_executor:
  ros__parameters:
    auto_reset: true
    wait_timeout_s: 30.0
    planning_time_s: 10.0
    planning_attempts: 3
    velocity_scale: 0.95
    acceleration_scale: 0.95
    approach_height_m: 0.10
    gripper_offset_m: 0.1234
    grasp_descent_m: 0.120
    place_descent_m: 0.105
    place_press_depth_m: 0.001
    cartesian_speed_scale: 0.90
    grasp_speed_scale: 0.80
    place_speed_scale: 0.75
    place_acceleration_scale: 0.40
    lift_speed_scale: 0.90
    transport_velocity_scale: 0.95
    transport_acceleration_scale: 0.20
    # Keep rotation and vertical contact conservative for long bricks while
    # allowing their clear, overhead translation to run close to full speed.
    large_part_motion_scale: 0.65
    large_part_transport_scale: 0.90
    # Clear-space motion can run faster than contact-sensitive vertical strokes.
    free_motion_time_scale: 0.30
    payload_motion_time_scale: 0.90
    # Speed up vertical approach and placement, but keep loaded lift timing nominal.
    contact_motion_time_scale: 0.75
    lift_motion_time_scale: 1.0
    gripper_open_m: 0.04
    gripper_closed_m: 0.002
    gripper_duration_s: 0.20
    motion_settle_s: 0.02
    release_settle_s: 0.06
    grasp_confirmation_timeout_s: 5.0
    # panda_hand is mounted 45 degrees from panda_link8. Compensate so the
    # physical finger-closing axis, rather than the link8 axis, follows the plan.
    tool_yaw_offset_deg: 45.0
    # Keep a carried part upright during both planned and fallback transfers.
    tool_tilt_tolerance_rad: 0.08
    verify_lift_m: 0.025
    # Keep the tool axis on the estimated geometric centre of every part.
    grasp_offset_xy: [0.0, 0.0]

visual_moveit_executor:
  ros__parameters:
    source_mode: vision
    auto_reset: true
    wait_timeout_s: 30.0
    planning_time_s: 6.0
    planning_attempts: 2
    velocity_scale: 0.90
    acceleration_scale: 0.90
    approach_height_m: 0.10
    gripper_offset_m: 0.1234
    grasp_descent_m: 0.120
    # Continue far enough to guarantee first support contact despite small
    # visual and grasp-height errors. The bridge stops the stroke immediately
    # when the held part touches the plate or an assembled part.
    # The oblique camera corrects XY only. Its lightweight geometry backend
    # estimates a visible surface rather than a reliable object-centre Z, so
    # the calibrated vertical stroke remains independent of visual depth.
    place_descent_m: 0.1285
    place_press_depth_m: 0.001
    cartesian_speed_scale: 0.90
    grasp_speed_scale: 0.80
    # A lower acceleration on the final descent prevents the physically held
    # part from twisting before it reaches the assembly surface.
    place_speed_scale: 0.75
    place_acceleration_scale: 0.40
    lift_speed_scale: 0.90
    transport_velocity_scale: 0.95
    transport_acceleration_scale: 0.20
    # Keep rotation and vertical contact conservative for the heavier 4x2 beam.
    large_part_motion_scale: 0.65
    large_part_transport_scale: 0.90
    free_motion_time_scale: 0.30
    payload_motion_time_scale: 0.90
    # Contact descent is faster; the conservative lift avoids payload slip.
    contact_motion_time_scale: 0.75
    lift_motion_time_scale: 1.0
    gripper_open_m: 0.04
    gripper_closed_m: 0.002
    gripper_duration_s: 0.20
    motion_settle_s: 0.02
    release_settle_s: 0.06
    # Keep the physical fingers parallel to a detected part's local X/Y axes.
    tool_yaw_offset_deg: 45.0
    tool_tilt_tolerance_rad: 0.08
    perception_service: /lego_vision/detect
    placement_perception_service: /lego_vision/detect_placement
    visual_place_correction: true
    visual_place_correction_iterations: 2
    # The lightweight geometry backend sees only the unoccluded part surface,
    # so its oblique-view centroid is suitable for verification but not servoing.
    visual_place_correction_backends: [groundingdino_sam_foundationpose]
    # White parts merge with the white Panda hand in the lightweight colour
    # backend. FoundationPose users can clear this list after mask validation.
    visual_place_correction_excluded_colors: [white]
    # Park above the assembly-side edge of the loose-part workspace. This keeps
    # the fixed overhead camera's central source view clear of the forearm.
    observe_pose_xyz: [0.30, 0.10, 0.50]
    # Vision returns the part centre; do not bias the grasp toward an edge.
    grasp_offset_xy: [0.0, 0.0]
    place_offset_xy: [0.0, 0.0]
