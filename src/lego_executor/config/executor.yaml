oracle_moveit_executor:
  ros__parameters:
    auto_reset: true
    wait_timeout_s: 30.0
    planning_time_s: 10.0
    planning_attempts: 3
    velocity_scale: 0.75
    acceleration_scale: 0.75
    approach_height_m: 0.15
    gripper_offset_m: 0.1234
    grasp_descent_m: 0.170
    place_descent_m: 0.155
    place_press_depth_m: 0.001
    cartesian_speed_scale: 0.30
    place_speed_scale: 0.30
    place_acceleration_scale: 0.20
    lift_speed_scale: 0.55
    # Wrist rotation is the highest torsional load on a held brick. Keep this
    # stage conservative while allowing the translation stages to stay fast.
    transport_rotation_speed_scale: 0.12
    transport_velocity_scale: 0.40
    transport_acceleration_scale: 0.04
    # Long bricks need lower Cartesian acceleration because the contact point
    # is farther from the part centre than it is for a square brick.
    large_part_motion_scale: 0.65
    gripper_open_m: 0.04
    gripper_closed_m: 0.010
    gripper_duration_s: 0.40
    motion_settle_s: 0.10
    release_settle_s: 0.20
    grasp_confirmation_timeout_s: 5.0
    # With the Panda hand pointing down, its closing axis is 90 degrees from
    # the tool X axis. Zero offset therefore puts both pads parallel to the
    # part sides instead of pinching two corners.
    tool_yaw_offset_deg: 0.0
    # Keep a carried part upright during both planned and fallback transfers.
    tool_tilt_tolerance_rad: 0.08
    verify_lift_m: 0.025
    # Keep the tool axis on the estimated geometric centre of every part.
    grasp_offset_xy: [0.0, 0.0]

visual_moveit_executor:
  ros__parameters:
    source_mode: vision
    auto_reset: true
    wait_timeout_s: 30.0
    planning_time_s: 6.0
    planning_attempts: 2
    velocity_scale: 0.90
    acceleration_scale: 0.90
    approach_height_m: 0.15
    gripper_offset_m: 0.1234
    grasp_descent_m: 0.170
    # Continue far enough to guarantee first support contact despite small
    # visual and grasp-height errors. The bridge stops the stroke immediately
    # when the held part touches the plate or an assembled part.
    # The oblique camera corrects XY only. Its lightweight geometry backend
    # estimates a visible surface rather than a reliable object-centre Z, so
    # the calibrated vertical stroke remains independent of visual depth.
    place_descent_m: 0.1773
    place_press_depth_m: 0.001
    cartesian_speed_scale: 0.45
    # A lower acceleration on the final descent prevents the physically held
    # part from twisting before it reaches the assembly surface.
    place_speed_scale: 0.40
    place_acceleration_scale: 0.20
    lift_speed_scale: 0.65
    transport_rotation_speed_scale: 0.12
    transport_velocity_scale: 0.40
    transport_acceleration_scale: 0.04
    # The 4x2 beam has almost twice the mass and a longer moment arm.
    large_part_motion_scale: 0.65
    gripper_open_m: 0.04
    gripper_closed_m: 0.010
    gripper_duration_s: 0.45
    motion_settle_s: 0.08
    release_settle_s: 0.15
    tool_yaw_offset_deg: 0.0
    tool_tilt_tolerance_rad: 0.08
    perception_service: /lego_vision/detect
    placement_perception_service: /lego_vision/detect_placement
    visual_place_correction: true
    visual_place_correction_iterations: 2
    # White parts merge with the white Panda hand in the lightweight colour
    # backend. FoundationPose users can clear this list after mask validation.
    visual_place_correction_excluded_colors: [white]
    # Above the loose-part workspace, shifted toward the assembly plate so the
    # full source region remains close to the centre of the wrist-camera view.
    observe_pose_xyz: [0.45, -0.30, 0.50]
    # A fixed joint target keeps the elbow out of the overhead camera view.
    # Re-solving the same Cartesian pose can otherwise select a different IK
    # branch after each placement and occlude the remaining loose parts.
    observe_joint_positions: [-2.346649, 0.253827, 1.862806, -1.956540, -0.255224, 1.873248, -1.182563]
    # Vision returns the part centre; do not bias the grasp toward an edge.
    grasp_offset_xy: [0.0, 0.0]
    place_offset_xy: [0.0, 0.0]
